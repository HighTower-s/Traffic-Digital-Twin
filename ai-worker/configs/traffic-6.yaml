

video: data/input_videos/traffic-6.mp4

traffic_state:
  window_sec: 20
  thresholds:
    busy_occupancy: 3.0       # ยังไม่ได้จูนกับชุดนี้ — เป็นค่าเริ่มต้น
    standstill_flow: 7.5
    slow_flow: 32.0

# ---- ค่ารัน ----
model: data/weights/yolov8s.pt
camera_id: cam-chalongkrung-01

imgsz: 1280
conf: 0.35
tracker: bytetrack.yaml       # bytetrack.yaml หรือ botsort.yaml (สลับ ID น้อยกว่า แต่ช้ากว่า)
device: 0                     # auto | cpu | 0

show_window: true
max_frames: 0                 # 0 = ทั้งคลิป
emit_preview: 20

send_to_backend: true         # ส่ง spawn ตอน main (สถานะจราจรต้องใช้ replay --backend)
backend_url: http://localhost:3000

zones:
  - name: in
    expectedDirection: toward
    polygon: [[876, 2142], [3258, 2136], [2385, 684], [1707, 654]]
    line: [[1224, 1485], [3060, 1536]]
    occupancyPolygon: [[870, 2148], [1818, 447], [2262, 435], [3270, 2136]]
  - name: out
    expectedDirection: away
    polygon: [[108, 2142], [3, 2145], [15, 1101], [1116, 552], [1533, 603], [222, 2079]]
    line: [[423, 855], [1296, 921]]
    occupancyPolygon: [[12, 1074], [1353, 393], [1665, 444], [114, 2151], [6, 2139], [0, 1170]]