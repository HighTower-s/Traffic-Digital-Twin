# traffic-5 — กล้อง KMITL มุมเดิม จราจรปกติ (4K)
#
# ชุดโซน + เกณฑ์ของมุมกล้องนี้โดยเฉพาะ — เรียกใช้ด้วย `use: traffic-5` ใน config.yaml
# **เกณฑ์ผูกกับโซน** ค่า occupancy ขึ้นกับขนาดกรอบและมุมกล้อง ย้ายข้ามไฟล์ไม่ได้
# สถานะ: ใช้เป็นฐานอ้างอิง 'จราจรปกติ' · 3840x2160 30fps 93 วินาที
#         วัดได้ occupancy 0.20-2.26 ทุกหน้าต่างเป็น normal

video: data/input_videos/traffic-5.mp4

traffic_state:
  window_sec: 20
  thresholds:
    busy_occupancy: 3.0       # ยังไม่ได้จูนกับชุดนี้ — เป็นค่าเริ่มต้น
    standstill_flow: 2.0
    slow_flow: 12.0

# ---- ค่ารัน ----
model: data/weights/yolov8s.pt
camera_id: cam-chalongkrung-01

imgsz: 1280
conf: 0.35
tracker: bytetrack.yaml       # bytetrack.yaml หรือ botsort.yaml (สลับ ID น้อยกว่า แต่ช้ากว่า)
device: 0                     # auto | cpu | 0

show_window: true
max_frames: 0                 # 0 = ทั้งคลิป
emit_preview: 20

send_to_backend: true         # ส่ง spawn ตอน main (สถานะจราจรต้องใช้ replay --backend)
backend_url: http://localhost:3000

zones:
  - name: in
    expectedDirection: toward
    polygon: [[2172, 1530], [3333, 1563], [2463, 903], [2013, 909]]
    line: [[3105, 1305], [2118, 1287]]
    occupancyPolygon: [[2178, 1566], [3369, 1608], [2325, 813], [1986, 792]]
  - name: out
    expectedDirection: away
    polygon: [[1827, 1551], [1875, 924], [1374, 918], [681, 1536]]
    line: [[1131, 1110], [1854, 1116]]
    occupancyPolygon: [[1824, 1518], [1884, 792], [1527, 789], [705, 1503]]
