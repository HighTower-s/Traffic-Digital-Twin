

video: data/input_videos/traffic-2.mp4

traffic_state:
  window_sec: 20
  thresholds:
    busy_occupancy: 3.0       # ยังไม่ได้จูนกับชุดนี้ — เป็นค่าเริ่มต้น
    standstill_flow: 7.5
    slow_flow: 32.0

# ---- ค่ารัน ----
model: data/weights/yolov8s.pt
camera_id: cam-chalongkrung-01

imgsz: 1280
conf: 0.35
tracker: bytetrack.yaml       # bytetrack.yaml หรือ botsort.yaml (สลับ ID น้อยกว่า แต่ช้ากว่า)
device: 0                     # auto | cpu | 0

show_window: true
max_frames: 0                 # 0 = ทั้งคลิป
emit_preview: 20

send_to_backend: true         # ส่ง spawn ตอน main (สถานะจราจรต้องใช้ replay --backend)
backend_url: http://localhost:3000

zones:
  - name: in
    expectedDirection: toward
    polygon: [[2007, 1590], [3567, 1611], [2430, 714], [1962, 708]]
    line: [[1980, 1191], [3072, 1215]]
    occupancyPolygon: [[2004, 1584], [3540, 1614], [2313, 630], [1962, 624]]
  - name: out
    expectedDirection: away
    polygon: [[1698, 1590], [267, 1575], [1473, 666], [1878, 663]]
    line: [[1143, 903], [1848, 882]]
    occupancyPolygon: [[1704, 1575], [1896, 597], [1575, 612], [261, 1569]]
