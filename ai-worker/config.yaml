# AI Worker — ค่าตั้งค่าสำหรับ prototype (line counting)
# รัน: python -m src.main   (หรือ --config other.yaml เพื่อใช้ไฟล์อื่น)

video: data/input_videos/event-2.mp4
model: data/weights/yolov8s.pt
camera_id: cam-chalongkrung-01

imgsz: 1280
conf: 0.35
tracker: bytetrack.yaml        #bytetrack.yaml หรือ botsort.yaml (สลับ ID น้อยกว่า แต่ช้ากว่า)
device: 0                   # auto | cpu | 0

show_window: true
max_frames: 0                 # 0 = ทั้งคลิป
emit_preview: 20             # 0 = print ทุก event ถ้ารถหนาแน่นใช้ตัวเลขจำกัด

send_to_backend: true        # true = POST spawn event เข้า backend แบบ real-time ด้วย
backend_url: http://localhost:3000   # ต้องรัน backend (cd backend && npm run dev) ไว้ก่อน

# เกณฑ์ตัดสินสถานการณ์จราจร — ตัดสินจาก 2 ค่า: occupancy (รถเยอะไหม) x vehicleFlowRate (รถขยับไหม)
# หมายเหตุ: flow ที่ใช้ตัดสิน "ไม่รวมมอเตอร์ไซค์" เพราะมุดผ่านรถติดได้ ถ้ารวมจะไม่มีวันเจอ standstill
#   รถน้อย                -> normal
#   รถเยอะ + ไหลได้ดี      -> high_density
#   รถเยอะ + ขยับช้า       -> slow_moving
#   รถเยอะ + แทบไม่ขยับ    -> standstill
# แก้ค่าตรงนี้แล้วรัน `python -m src.replay --fast` ดูผลได้ทันที ไม่ต้องรัน YOLO ใหม่
traffic_state:
  window_sec: 20              # สรุปสถานะทุกกี่วินาที (เพิ่มถ้าอัตราการไหลแกว่งเกินไป)
  thresholds:
    busy_occupancy: 3.0       # occupancy เกินนี้ = หนาแน่น
    standstill_flow: 2.0      # รถยนต์/นาที ต่ำกว่านี้ + หนาแน่น = ติดสนิท
    slow_flow: 12.0           # รถยนต์/นาที ต่ำกว่านี้ + หนาแน่น = เคลื่อนตัวช้า
# ⚠️ ยังไม่ได้จูนกับคลิปรถติดจริง — ค่าที่วัดได้จาก traffic-5 (จราจรปกติ) คือ
#    occupancy 0.20-2.76 / flow 0.0-42.4 ซึ่ง busy_occupancy=3.0 เฉียดมาก (ห่างแค่ 0.24)
#    ถ่ายคลิปรถติดมาวัดแล้วค่อยตั้งค่าใหม่ให้แยก 2 กลุ่มได้ชัดกว่านี้

